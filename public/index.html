<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flâsh Pro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-container">
    <div class="auth-card">
      <h2>Flâsh Pro</h2>
      <p>အကောင့်ဝင်ပါ သို့မဟုတ် အကောင့်သစ်ဖွင့်ပါ</p>
      <input type="text" id="auth-user" placeholder="Username">
      <input type="password" id="auth-pass" placeholder="Password">
      <button class="btn-primary" onclick="login()">Login</button>
      <button class="btn-secondary" onclick="register()">Register</button>
    </div>
  </div>

  <!-- App Main Screen (Full Screen Layout with Sidebar) -->
  <div id="app-container" style="display: none;">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="user-avatar" id="sidebar-user-avatar">U</div>
      <nav class="nav-menu">
        <button class="nav-btn active" onclick="switchTab('ai-chat', this)"><i class="fa-solid fa-robot"></i></button>
        <button class="nav-btn" onclick="switchTab('friends-chat', this)"><i class="fa-solid fa-comments"></i></button>
        <button class="nav-btn" onclick="switchTab('group-chat', this)"><i class="fa-solid fa-users"></i></button>
        <button class="nav-btn" onclick="switchTab('downloader', this)"><i class="fa-solid fa-circle-down"></i></button>
        <button class="nav-btn" onclick="switchTab('music', this)"><i class="fa-solid fa-music"></i></button>
        <button class="nav-btn" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i></button>
      </nav>
    </aside>

    <!-- Main Content Panel -->
    <main class="main-content">
      <!-- AI Chat -->
      <section id="ai-chat" class="tab-pane active">
        <div class="header-bar">
          <h2>AI Chat</h2>
          <select id="ai-provider" class="select-sm">
            <option value="gemini">Gemini AI</option>
            <option value="groq">Groq (Llama-3)</option>
          </select>
        </div>
        <div id="ai-logs" class="chat-area"></div>
        <div class="chat-input-bar">
          <input type="text" id="ai-prompt" placeholder="AI ကို မေးပါ...">
          <button onclick="sendAiPrompt()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </section>

      <!-- Private Chat -->
      <section id="friends-chat" class="tab-pane">
        <div class="header-bar">
          <h2>မိတ်ဆွေများ</h2>
        </div>
        <div id="friends-list" class="list-container"></div>
      </section>

      <!-- Private Chat Window -->
      <section id="private-chat-win" class="tab-pane">
        <div class="header-bar">
          <button onclick="switchTab('friends-chat')" class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
          <h2 id="target-username">Chat</h2>
        </div>
        <div id="private-logs" class="chat-area"></div>
        <div class="chat-input-bar">
          <input type="text" id="private-msg" placeholder="စာရိုက်ပါ...">
          <button onclick="sendPrivateMsg()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </section>

      <!-- Group Chat -->
      <section id="group-chat" class="tab-pane">
        <div class="header-bar">
          <h2>Group Chat</h2>
        </div>
        <div id="group-logs" class="chat-area"></div>
        <div class="chat-input-bar">
          <input type="text" id="group-msg" placeholder="Group သို့ စာပို့ရန်...">
          <button onclick="sendGroupMsg()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </section>

      <!-- Downloader -->
      <section id="downloader" class="tab-pane">
        <div class="header-bar"><h2>Video Downloader</h2></div>
        <div class="padded-box">
          <input type="text" id="dl-url" placeholder="YouTube, TikTok, FB Video Link ထည့်ပါ...">
          <button class="btn-primary" onclick="downloadVideo()">Video Link ယူရန်</button>
          <div id="dl-result" class="result-box"></div>
        </div>
      </section>

      <!-- Music Player -->
      <section id="music" class="tab-pane">
        <div class="header-bar"><h2>Music Player</h2></div>
        <div class="padded-box">
          <input type="file" id="music-file" accept="audio/*">
          <button class="btn-primary" onclick="uploadMusic()">Upload Song</button>
          <div id="music-list" class="list-container"></div>
        </div>
      </section>

      <!-- Settings -->
      <section id="settings" class="tab-pane">
        <div class="header-bar"><h2>Settings</h2></div>
        <div class="padded-box">
          <input type="text" id="gemini-key" placeholder="Gemini API Key">
          <input type="text" id="groq-key" placeholder="Groq API Key">
          <button class="btn-primary" onclick="saveSettings()">Save Keys</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
